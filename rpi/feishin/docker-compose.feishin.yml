services:
  feishin:
    image: ghcr.io/jeffvli/feishin:latest
    container_name: feishin
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9180"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      SERVER_NAME: "m3v's music box"
      SERVER_LOCK: "true"
      SERVER_TYPE: navidrome
      SERVER_URL: https://navidrome.m3v.dev
      LEGACY_AUTHENTICATION: "false"
      ANALYTICS_DISABLED: "true"
      FS_GENERAL_ACCENT: rgb(53,116,252)
      FS_GENERAL_ALBUM_BACKGROUND: "false"
      FS_GENERAL_ALBUM_BACKGROUND_BLUR: "3"
      FS_GENERAL_ARTIST_BACKGROUND: "true"
      FS_GENERAL_ARTIST_BACKGROUND_BLUR: "3"
      FS_GENERAL_BLUR_EXPLICIT_IMAGES: "false"
      FS_GENERAL_COMBINED_LYRICS_AND_VISUALIZER: "false"
      FS_GENERAL_ENABLE_GRID_MULTI_SELECT: "false"
      FS_GENERAL_EXTERNAL_LINKS: "true"
      FS_GENERAL_FOLLOW_CURRENT_SONG: "true"
      FS_GENERAL_FOLLOW_SYSTEM_THEME: "false"
      FS_GENERAL_HOME_FEATURE: "true"
      FS_GENERAL_HOME_FEATURE_STYLE: single
      FS_GENERAL_LANGUAGE: en
      FS_GENERAL_THEME: catppuccinMocha
      FS_GENERAL_THEME_DARK: catppuccinMocha
      FS_GENERAL_THEME_LIGHT: nord
      FS_GENERAL_LASTFM_API_KEY: ${LASTFM_APIKEY}
      FS_GENERAL_LAST_FM: "true"
      FS_GENERAL_LISTEN_BRAINZ: "true"
      FS_GENERAL_MUSIC_BRAINZ: "true"
      FS_GENERAL_NATIVE_ASPECT_RATIO: "false"
      FS_GENERAL_PLAYERBAR_OPEN_DRAWER: "false"
      FS_GENERAL_PRIMARY_SHADE: "6"
      FS_GENERAL_QOBUZ: "true"
      FS_GENERAL_RESUME: "true"
      FS_GENERAL_SHOW_LYRICS_IN_SIDEBAR: "true"
      FS_GENERAL_SHOW_RATINGS: "true"
      FS_GENERAL_SHOW_VISUALIZER_IN_SIDEBAR: "true"
      FS_GENERAL_SIDEBAR_COLLAPSED_NAVIGATION: "true"
      FS_GENERAL_SIDEBAR_COLLAPSE_SHARED: "false"
      FS_GENERAL_SIDEBAR_PLAYLIST_FOLDERS: "true"
      FS_GENERAL_SIDEBAR_PLAYLIST_FOLDER_SEPARATOR: /
      FS_GENERAL_SIDEBAR_PLAYLIST_FOLDER_TREE_INDENT: "16"
      FS_GENERAL_SIDEBAR_PLAYLIST_FOLDER_VIEW: tree
      FS_GENERAL_SIDEBAR_PLAYLIST_LIST: "true"
      FS_GENERAL_SIDEBAR_PLAYLIST_MODE: expanded
      FS_GENERAL_SIDEBAR_PLAYLIST_SORTING: "false"
      FS_GENERAL_SIDE_QUEUE_TYPE: sideQueue
      FS_GENERAL_SIDE_QUEUE_LAYOUT: horizontal
      FS_GENERAL_USE_THEME_ACCENT_COLOR: "false"
      FS_GENERAL_USE_THEME_PRIMARY_SHADE: "true"
      FS_GENERAL_ZOOM_FACTOR: "100"
      FS_PLAYBACK_MEDIA_SESSION: "false"
      FS_PLAYBACK_WEB_AUDIO: "true"
      FS_PLAYBACK_AUDIO_FADE_ON_STATUS_CHANGE: "true"
      FS_PLAYBACK_PRESERVE_PITCH: "true"
      FS_PLAYBACK_SCROBBLE_ENABLED: "true"
      FS_PLAYBACK_SCROBBLE_NOTIFY: "false"
      FS_PLAYBACK_SCROBBLE_AT_DURATION: "240"
      FS_PLAYBACK_SCROBBLE_AT_PERCENTAGE: "75"
      FS_PLAYBACK_TRANSCODE_ENABLED: "false"
      FS_DISCORD_ENABLED: "true"
      FS_DISCORD_CLIENT_ID: ${FS_DISCORD_CLIENT_ID}
      FS_DISCORD_DISPLAY_TYPE: song
      FS_DISCORD_LINK_TYPE: none
      FS_DISCORD_SHOW_AS_LISTENING: "true"
      FS_DISCORD_SHOW_PAUSED: "true"
      FS_DISCORD_SHOW_SERVER_IMAGE: "false"
      FS_DISCORD_SHOW_STATE_ICON: "true"
      FS_LYRICS_FETCH: "true"
      FS_LYRICS_FOLLOW: "true"
      FS_LYRICS_DELAY_MS: "0"
      FS_LYRICS_PREFER_LOCAL: "true"
      FS_LYRICS_SHOW_MATCH: "true"
      FS_LYRICS_SHOW_PROVIDER: "true"
      FS_LYRICS_ALIGNMENT: center
      FS_AUTO_DJ_ALBUM_STRATEGY: similar
      FS_AUTO_DJ_ENABLED: "false"
      FS_AUTO_DJ_ITEM_COUNT: "5"
      FS_AUTO_DJ_MODE: songs
      FS_AUTO_DJ_SONG_STRATEGY: similar
      FS_AUTO_DJ_TIMING: "1"
      FS_CSS_CONTENT: |
        /* ── OPTIONAL: hide the right panel of the full screen player ───────────
           (Up Next / Related / Lyrics / Visualizer). To enable, remove the
           comment markers around the two rules below — the artwork and controls
           then center on screen.
           NOTE: Feishin's sanitizer strips comments when you save custom CSS, so
           keep this file as your master copy: uncomment HERE, then re-apply. */

        /*
        .fs-full-screen-player-module-responsive-container {
            grid-template-columns: minmax(0, 1fr) !important;
            justify-items: center;
        }

        .fs-full-screen-player-queue-module-grid-container {
            display: none !important;
        }
        */

        /* ── OPTIONAL: disable the two-color accent gradient ────────────────────
           The seekbar, volume slider, filled buttons, toggles, and the active
           tab indicator fade from the info color into the accent. Remove the
           comment markers below to use the flat accent color everywhere instead.
           (html:root outranks the token definitions further down, so this
           override wins no matter where it sits.) */

        /*
        html:root {
            --fluentshin-grad: none;
            --fluentshin-grad-vertical: none;
            --fluentshin-grad-glass: none;
        }
        */

        /* ── Adaptive design tokens ──────────────────────────────────────────── */

        :root {
            --fluentshin-accent: var(--theme-colors-primary);
            --fluentshin-accent-2: var(--theme-colors-state-info);
            --fluentshin-fg: var(--theme-colors-foreground);
            --fluentshin-bg: var(--theme-colors-background);
            --fluentshin-tint: color-mix(in srgb, var(--fluentshin-accent) 12%, transparent);
            --fluentshin-tint-strong: color-mix(in srgb, var(--fluentshin-accent) 18%, transparent);
            --fluentshin-selection: color-mix(in srgb, var(--fluentshin-accent) 35%, transparent);
            --fluentshin-border: color-mix(in srgb, var(--fluentshin-accent) 16%, transparent);
            --fluentshin-border-soft: color-mix(in srgb, var(--fluentshin-accent) 9%, transparent);
            --fluentshin-border-strong: color-mix(in srgb, var(--fluentshin-accent) 35%, transparent);
            --fluentshin-glow: color-mix(in srgb, var(--fluentshin-accent) 45%, transparent);
            --fluentshin-halo: color-mix(in srgb, var(--fluentshin-accent) 20%, transparent);
            --fluentshin-chip: color-mix(in srgb, var(--fluentshin-fg) 5%, transparent);
            --fluentshin-chip-border: color-mix(in srgb, var(--fluentshin-fg) 9%, transparent);
            --fluentshin-glass: color-mix(in srgb, var(--fluentshin-bg) 72%, transparent);
            --fluentshin-glass-deep: color-mix(in srgb, var(--fluentshin-bg) 88%, transparent);
            --fluentshin-specular: color-mix(in srgb, var(--theme-colors-white) 9%, transparent);
            --fluentshin-grad: linear-gradient(90deg, var(--fluentshin-accent-2) 0%, var(--fluentshin-accent) 100%);
            --fluentshin-grad-vertical: linear-gradient(180deg, var(--fluentshin-accent-2) 0%, var(--fluentshin-accent) 100%);
            --fluentshin-grad-glass: linear-gradient(
                90deg,
                color-mix(in srgb, var(--fluentshin-accent-2) 22%, transparent) 0%,
                color-mix(in srgb, var(--fluentshin-accent) 28%, transparent) 100%
            );
            --fluentshin-ink: linear-gradient(
                135deg,
                var(--fluentshin-fg) 35%,
                color-mix(in srgb, var(--fluentshin-fg) 45%, var(--fluentshin-accent)) 100%
            );
            --theme-scrollbar-size: 10px;
            --theme-scrollbar-handle-border-radius: 8px;
            --theme-scrollbar-handle-background: color-mix(in srgb, var(--fluentshin-accent) 22%, transparent);
            --theme-scrollbar-handle-hover-background: color-mix(in srgb, var(--fluentshin-accent) 40%, transparent);
            --theme-scrollbar-handle-active-background: color-mix(in srgb, var(--fluentshin-accent) 55%, transparent);
        }

        .fs-default-layout-module-layout {
            background-color: var(--fluentshin-bg);
            background-image:
                radial-gradient(1100px 700px at 12% -8%, color-mix(in srgb, var(--fluentshin-accent) 14%, transparent), transparent 62%),
                radial-gradient(900px 600px at 105% 0%, color-mix(in srgb, var(--fluentshin-accent-2) 9%, transparent), transparent 60%),
                radial-gradient(1000px 800px at 80% 115%, color-mix(in srgb, var(--theme-colors-state-warning) 5%, transparent), transparent 60%);
        }

        .fs-main-content-module-main-content-container::after {
            content: '';
            position: absolute;
            inset: -40%;
            z-index: 0;
            pointer-events: none;
            background-image:
                radial-gradient(40% 35% at 28% 30%, color-mix(in srgb, var(--fluentshin-accent) 8%, transparent), transparent 70%),
                radial-gradient(35% 30% at 72% 65%, color-mix(in srgb, var(--fluentshin-accent-2) 6%, transparent), transparent 70%);
            animation: fluentshin-drift 50s ease-in-out infinite alternate;
            will-change: transform;
        }

        @keyframes fluentshin-drift {
            0% {
                transform: translate3d(-3%, -2%, 0) rotate(0deg) scale(1);
            }

            50% {
                transform: translate3d(2%, 2%, 0) rotate(2deg) scale(1.05);
            }

            100% {
                transform: translate3d(-1%, 3%, 0) rotate(-2deg) scale(1.02);
            }
        }

        #default-layout {
            grid-template-rows: 0 calc(100dvh - 114px) 114px !important;
        }

        #default-layout.fs-default-layout-module-windows,
        #default-layout.fs-default-layout-module-macos {
            grid-template-rows: 30px calc(100dvh - 144px) 114px !important;
        }

        .fs-main-content-module-main-content-container {
            margin-right: 12px;
            overflow: hidden;
            background: transparent;
        }

        .fs-main-content-module-main-content-container:has(.fs-full-screen-player-module-container) {
            margin-right: 0;
            overflow: visible;
        }

        .fs-main-content-module-main-content-body,
        #main-content .fs-main-content-module-main-content-body {
            height: auto !important;
            min-height: 0 !important;
            max-height: 100% !important;
            padding-bottom: 24px !important;
        }

        .fs-native-scroll-area-module-scroll-area {
            height: calc(100vh - 114px) !important;
        }

        .fs-sidebar-module-container {
            padding-bottom: 24px !important;
            background: transparent;
        }

        .fs-sidebar-module-accordion-content {
            background: transparent;
        }

        .fs-collapsed-sidebar-module-sidebar-container {
            max-height: calc(100vh - 143px);
        }

        .fs-collapsed-sidebar-module-sidebar-container.fs-collapsed-sidebar-module-web,
        .fs-collapsed-sidebar-module-sidebar-container.fs-collapsed-sidebar-module-linux {
            max-height: calc(100vh - 173px);
        }

        .fs-left-sidebar-module-container {
            background-color: color-mix(in srgb, var(--theme-colors-background-alternate) 60%, transparent);
            border-right: 1px solid transparent;
            border-right-color: var(--fluentshin-border-soft);
            backdrop-filter: blur(24px) saturate(1.4);
        }

        .fs-right-sidebar-module-right-sidebar-container {
            background-color: color-mix(in srgb, var(--theme-colors-background-alternate) 60%, transparent);
            border-left: 1px solid transparent;
            border-left-color: var(--fluentshin-border-soft);
            backdrop-filter: blur(24px) saturate(1.4);
        }

        .fs-full-screen-player-module-container {
            height: 100vh !important;
            padding-right: 12px;
        }

        .fs-full-screen-player-module-container .fs-full-screen-player-module-responsive-container {
            height: calc(100% - 250px);
        }

        #player-bar {
            position: fixed;
            right: 12px;
            bottom: 12px;
            left: 12px;
            height: 90px;
            background-color: var(--fluentshin-glass);
            border: 1px solid transparent;
            border-top-color: var(--fluentshin-border);
            border-right-color: var(--fluentshin-border);
            border-bottom-color: var(--fluentshin-border);
            border-left-color: var(--fluentshin-border);
            border-radius: 18px;
            box-shadow:
                0 16px 48px rgb(0 0 0 / 35%),
                inset 0 1px 0 var(--fluentshin-specular);
            backdrop-filter: blur(28px) saturate(1.6);
        }

        #player-bar .fs-playerbar-module-container {
            width: 100%;
            padding: 0 10px;
            border-top: 0;
        }

        @media (min-width: 900px) {
            #player-bar .fs-playerbar-module-right-grid-item .fs-playerbar-slider-module-root {
                min-width: 110px;
            }
        }

        .fs-playerbar-slider-module-bar {
            background-color: var(--fluentshin-accent);
            background-image: var(--fluentshin-grad);
        }

        .fs-playerbar-slider-module-thumb {
            transition: box-shadow 0.2s ease;
        }

        .fs-playerbar-slider-module-thumb:hover {
            box-shadow: 0 0 0 6px var(--fluentshin-halo);
        }

        .mantine-Slider-bar {
            background-color: var(--fluentshin-accent);
            background-image: var(--fluentshin-grad);
        }

        .fs-slider-module-thumb,
        .mantine-Slider-thumb {
            transition: box-shadow 0.2s ease;
        }

        .fs-slider-module-thumb:hover,
        .mantine-Slider-thumb:hover {
            box-shadow: 0 0 0 6px var(--fluentshin-halo);
        }

        .fs-player-button-module-main {
            background-color: var(--fluentshin-tint) !important;
            background-image: var(--fluentshin-grad-glass) !important;
            border-radius: 50%;
            box-shadow:
                inset 0 0 0 1px var(--fluentshin-border-strong),
                inset 0 1px 0 var(--fluentshin-specular);
            backdrop-filter: blur(8px) saturate(1.3);
            transition: background-color 0.18s ease, box-shadow 0.25s ease;
        }

        .fs-player-button-module-main:hover {
            background-color: var(--fluentshin-tint-strong) !important;
            box-shadow:
                inset 0 0 0 1px var(--fluentshin-border-strong),
                inset 0 1px 0 var(--fluentshin-specular),
                0 0 24px -4px var(--fluentshin-glow);
        }

        .fs-player-button-module-main svg {
            color: var(--fluentshin-fg);
            fill: var(--fluentshin-fg);
        }

        .fs-player-button-module-player-button {
            transition: color 0.15s ease, background-color 0.15s ease;
        }

        .fs-player-button-module-secondary svg,
        .fs-player-button-module-tertiary svg {
            transition: color 0.15s ease;
        }

        .fs-player-button-module-secondary:hover,
        .fs-player-button-module-tertiary:hover {
            background-color: transparent;
        }

        .fs-player-button-module-secondary:hover svg,
        .fs-player-button-module-tertiary:hover svg {
            color: var(--fluentshin-accent);
        }

        #player-bar .mantine-ActionIcon-root {
            border-radius: 999px;
        }

        #player-bar .mantine-ActionIcon-root:hover {
            background-color: var(--fluentshin-tint);
        }

        .fs-left-controls-module-image,
        .fs-left-controls-module-playerbar-image {
            border-radius: 10px;
            box-shadow: 0 4px 16px rgb(0 0 0 / 45%);
        }

        .fs-side-drawer-queue-module-queue-drawer {
            background-color: var(--fluentshin-glass);
            border: 1px solid transparent;
            border-top-color: var(--fluentshin-border);
            border-right-color: var(--fluentshin-border);
            border-bottom-color: var(--fluentshin-border);
            border-left-color: var(--fluentshin-border);
            backdrop-filter: blur(24px) saturate(1.5);
        }

        .fs-popover-module-dropdown:has([class*='fs-item-table']) {
            top: auto !important;
            right: 12px !important;
            bottom: 114px !important;
            left: auto !important;
            height: 75dvh !important;
        }

        .fs-popover-module-dropdown:has([class*='fs-item-table']) .mantine-Popover-arrow,
        .fs-popover-module-dropdown:has([class*='fs-item-table']) .fs-popover-module-arrow {
            display: none;
        }

        .fs-filter-bar-module-filter-bar {
            padding: 10px 12px;
            background-color: color-mix(in srgb, var(--fluentshin-bg) 55%, transparent);
            border-bottom: 1px solid transparent;
            border-bottom-color: var(--fluentshin-border-soft);
            backdrop-filter: blur(20px) saturate(1.4);
        }

        .fs-filter-bar-module-filter-bar button,
        .fs-library-header-bar-module-header-container button {
            border-radius: 999px;
        }

        .fs-filter-bar-module-filter-bar input,
        .fs-library-header-bar-module-header-container input {
            border-radius: 999px;
        }

        .fs-filter-bar-module-filter-bar .fs-button-module-root[data-variant='default'],
        .fs-filter-bar-module-filter-bar .fs-button-module-root[data-variant='subtle'],
        .fs-filter-bar-module-filter-bar .fs-button-module-root[data-variant='transparent'],
        .fs-filter-bar-module-filter-bar .fs-button-module-root[data-variant='outline'] {
            color: var(--theme-colors-surface-foreground);
            background-color: var(--fluentshin-chip);
            border: 1px solid transparent;
            border-top-color: var(--fluentshin-chip-border);
            border-right-color: var(--fluentshin-chip-border);
            border-bottom-color: var(--fluentshin-chip-border);
            border-left-color: var(--fluentshin-chip-border);
        }

        .fs-filter-bar-module-filter-bar .fs-button-module-root[data-variant='default']:hover,
        .fs-filter-bar-module-filter-bar .fs-button-module-root[data-variant='subtle']:hover,
        .fs-filter-bar-module-filter-bar .fs-button-module-root[data-variant='transparent']:hover,
        .fs-filter-bar-module-filter-bar .fs-button-module-root[data-variant='outline']:hover {
            color: var(--fluentshin-fg);
            background-color: var(--fluentshin-tint-strong);
            border-top-color: var(--fluentshin-border-strong);
            border-right-color: var(--fluentshin-border-strong);
            border-bottom-color: var(--fluentshin-border-strong);
            border-left-color: var(--fluentshin-border-strong);
        }

        .fs-filter-bar-module-filter-bar .fs-text-input-module-input {
            background-color: var(--fluentshin-chip);
            border: 1px solid transparent;
            border-top-color: var(--fluentshin-chip-border);
            border-right-color: var(--fluentshin-chip-border);
            border-bottom-color: var(--fluentshin-chip-border);
            border-left-color: var(--fluentshin-chip-border);
        }

        .fs-filter-bar-module-filter-bar .mantine-Divider-root {
            border-top-color: var(--fluentshin-border-soft);
            border-left-color: var(--fluentshin-border-soft);
        }

        .fs-action-bar-module-container .fs-button-module-root {
            color: var(--theme-colors-surface-foreground);
            background-color: var(--fluentshin-chip);
            border: 1px solid transparent;
            border-top-color: var(--fluentshin-chip-border);
            border-right-color: var(--fluentshin-chip-border);
            border-bottom-color: var(--fluentshin-chip-border);
            border-left-color: var(--fluentshin-chip-border);
            border-radius: 999px;
        }

        .fs-action-bar-module-container .fs-button-module-root:hover {
            color: var(--fluentshin-fg);
            background-color: var(--fluentshin-tint-strong);
            border-top-color: var(--fluentshin-border-strong);
            border-right-color: var(--fluentshin-border-strong);
            border-bottom-color: var(--fluentshin-border-strong);
            border-left-color: var(--fluentshin-border-strong);
        }

        .fs-action-bar-module-container .fs-text-input-module-input {
            cursor: pointer;
            background-color: var(--fluentshin-chip);
            border: 1px solid transparent;
            border-top-color: var(--fluentshin-chip-border);
            border-right-color: var(--fluentshin-chip-border);
            border-bottom-color: var(--fluentshin-chip-border);
            border-left-color: var(--fluentshin-chip-border);
            border-radius: 999px;
            transition: border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.2s ease;
        }

        .fs-action-bar-module-container .fs-text-input-module-input:hover {
            background-color: var(--fluentshin-tint);
            border-top-color: var(--fluentshin-border-strong);
            border-right-color: var(--fluentshin-border-strong);
            border-bottom-color: var(--fluentshin-border-strong);
            border-left-color: var(--fluentshin-border-strong);
        }

        .fs-select-module-input,
        .fs-multi-select-module-input,
        .fs-number-input-module-input,
        .fs-textarea-module-input,
        .fs-color-input-module-input {
            background-color: var(--fluentshin-chip);
            border: 1px solid transparent;
            border-top-color: var(--fluentshin-chip-border);
            border-right-color: var(--fluentshin-chip-border);
            border-bottom-color: var(--fluentshin-chip-border);
            border-left-color: var(--fluentshin-chip-border);
        }

        .fs-color-input-module-dropdown {
            background-color: var(--fluentshin-glass);
            border: 1px solid transparent;
            border-top-color: var(--fluentshin-border);
            border-right-color: var(--fluentshin-border);
            border-bottom-color: var(--fluentshin-border);
            border-left-color: var(--fluentshin-border);
            border-radius: 12px;
            box-shadow:
                0 24px 64px rgb(0 0 0 / 40%),
                inset 0 1px 0 var(--fluentshin-specular);
            backdrop-filter: blur(28px) saturate(1.5);
        }

        .fs-multi-select-module-pill {
            background-color: var(--fluentshin-tint);
            border-radius: 999px;
        }

        .fs-segmented-control-module-root {
            background-color: var(--fluentshin-chip);
            border-radius: 10px;
        }

        .mantine-SegmentedControl-indicator {
            background-color: var(--fluentshin-tint);
            background-image: var(--fluentshin-grad-glass);
            border-radius: 8px;
        }

        .fs-segmented-control-module-root .fs-segmented-control-module-label {
            border-radius: 8px;
            transition: background-color 0.15s ease, color 0.15s ease, box-shadow 0.2s ease;
        }

        .fs-segmented-control-module-root .fs-segmented-control-module-label[data-active='true'] {
            color: var(--fluentshin-fg);
            background-color: var(--fluentshin-tint);
            background-image: var(--fluentshin-grad-glass);
            border-radius: 8px;
            box-shadow:
                inset 0 0 0 1px var(--fluentshin-border-strong),
                inset 0 1px 0 var(--fluentshin-specular);
            backdrop-filter: blur(8px) saturate(1.3);
        }

        .fs-pagination-module-root .fs-pagination-module-control {
            background-color: var(--fluentshin-chip);
            border-radius: 8px;
            box-shadow: inset 0 0 0 1px var(--fluentshin-chip-border);
            transition: background-color 0.15s ease, color 0.15s ease, box-shadow 0.2s ease;
        }

        .fs-pagination-module-root .fs-pagination-module-control:hover {
