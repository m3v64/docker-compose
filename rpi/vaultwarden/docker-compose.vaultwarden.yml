services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    depends_on:
      caddy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/alive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      DOMAIN: https://vault.${DOMAIN}
    volumes:
      - ${DATA_ROOT}/vaultwarden:/data
    ports:
      - "80:80"
    networks:
      - net
