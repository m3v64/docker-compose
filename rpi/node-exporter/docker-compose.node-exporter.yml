services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave
    networks:
      - net
