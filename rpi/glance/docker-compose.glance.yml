services:
  glance:
    image: glanceapp/glance:latest
    container_name: glance
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    depends_on:
      caddy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      GLANCE_ADMIN_PASSWORD: ${GLANCE_ADMIN_PASSWORD}
      GLANCE_SECRET_KEY: ${GLANCE_SECRET_KEY}
    volumes:
      - ${DATA_ROOT}/glance/glance.yml:/app/config/glance.yml
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9080:9080"
    networks:
      - net
