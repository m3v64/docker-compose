services:
  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:latest
    container_name: silverbullet
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      TZ: ${TZ}
      SB_USER: ${SB_USERNAME}:${SB_PASSWORD}
      SB_AUTH_TOKEN: ${SB_AUTH_TOKEN}
      SB_LOCKOUT_LIMIT: 10
      SB_LOCKOUT_TIME: 60
      SB_REMEMBER_ME_HOURS: 168
      SB_NAME: "${SB_NAME}"
      SB_DESCRIPTION: "${SB_DESCRIPTION}"
    volumes:
      - ${DATA_ROOT}/silverbullet:/space
    ports:
      - "3003:3000"
    networks:
      - net