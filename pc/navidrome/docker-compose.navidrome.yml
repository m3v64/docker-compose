services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4533/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ND_LOGLEVEL: info
      ND_SCANSCHEDULE: 1h
      ND_LASTFM_APIKEY: ${LASTFM_APIKEY}
      ND_LASTFM_SECRET: ${LASTFM_SECRET}
      ND_ENABLESHARING: "true"
      ND_DEFAULTSHAREEXPIRATION: 8760h
      ND_BASEURL: https://navidrome.m3v.dev
      ND_PORT: "4533"
    volumes:
      - ${DATA_ROOT}\navidrome:/data
      - ${MEDIA_ROOT}\music:/music:ro
    ports:
      - "4533:4533"
    networks:
      - net
