services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped
    cpus: "6.0"
    command: []
    tty: true
    stdin_open: true
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: mc-health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: "1.21.8"
      SERVER_PORT: "25565"
      INIT_MEMORY: 16G
      MAX_MEMORY: 32G
      ICON: https://m3v.dev/assets/mc-icon.jpg
      OVERRIDE_ICON: "true"
      MOTD: "~~~~~~~~~~~~<『mc.m3v.dev』>~~~~~~~~~~~~"
      USE_AIKAR_FLAGS: "true"
      TZ: ${TZ}
      DIFFICULTY: "3"
      ENABLE_COMMAND_BLOCK: "true"
      SIMULATION_DISTANCE: "6"
      VIEW_DISTANCE: "12"
      SPAWN_PROTECTION: "1"
      OPS: |-
        m3v_
      ALLOW_FLIGHT: "true"
    volumes:
      - ${DATA_ROOT}\minecraft\nov-25-boys:/data
    ports:
      - "25565:25565"
    networks:
      - net
