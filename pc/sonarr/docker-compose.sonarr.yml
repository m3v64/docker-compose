services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ${DATA_ROOT}/sonarr:/config
      - ${MEDIA_ROOT}:/media
    ports:
      - "8989:8989"
    networks:
      - net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"